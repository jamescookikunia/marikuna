<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="style.css">
<title>Love Page 💕</title>
</head>

<body>

<div class="card">

    <h1>Ika + Mari 💕</h1>
    <p>click the hearts 💖</p>

    <div class="buttons">

        <button class="heart-btn heart1"
        onclick="showMessage('I miss you 💖')"></button>

        <button class="heart-btn heart2"
        onclick="showMessage('I love you ❤️')"></button>

        <button class="heart-btn heart3"
        onclick="showMessage('I am a good boy 🥺')"></button>

    </div>

    <div class="message" id="message"></div>

    <!-- BACK BUTTON -->
    <button class="back-btn" onclick="window.location.href='index.html'">
⬅ Back
</button>

</div>

<script>
function showMessage(text){
    document.getElementById("message").innerHTML = text;
}

function goBack(){
    window.history.back();
}
</script>

</body>
</html>
